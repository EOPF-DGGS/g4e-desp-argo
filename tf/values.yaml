      c.KubeSpawner.profile_list = profile_list
  services:
    dask-gateway:
      display: false
singleuser:
  startTimeout: 600
  extraEnv:
    S3_ACCESS_KEY:
      valueFrom:
        secretKeyRef:
          name: s3-credentials
          key: accessKey
    S3_SECRET_KEY:
      valueFrom:
        secretKeyRef:
          name: s3-credentials
          key: secretKey
