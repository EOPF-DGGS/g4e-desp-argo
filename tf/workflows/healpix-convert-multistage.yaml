            fsspec.config.conf["s3"] = json.loads(json.dumps(options))
            # the same settings in the processes started from here (dask workers): fsspec
            # reads FSSPEC_S3 when imported, the credentials come from the AWS_* variables
            os.environ["FSSPEC_S3"] = json.dumps(
                {k: v for k, v in options.items() if k not in ("key", "secret")}
            )
            return options


        def storage_options_for(url, s3_options):
            if not url.startswith("s3://"):
                return None
            if s3_options is None:
                fail(f"{url} needs S3 credentials in {S3_CREDS_DIR}")
            options = json.loads(json.dumps(s3_options))
            if url.startswith(PUBLIC_READ_PREFIXES):
                options["s3_additional_kwargs"] = {"ACL": "public-read"}
            return options


        _half_pixel = {"corrected": 0}


        def same_transform(a, b):
            """Equal affine transforms (6 coefficients, relative tolerance 1e-9)."""
            return all(
                abs(p - q) <= 1e-9 * max(1.0, abs(p), abs(q)) for p, q in zip(tuple(a)[:6], tuple(b)[:6])
            )


        def fix_half_pixel():
            """Make extract_spatial_info_stac return the pixel-corner transform it is used as.

            For EOPF variables without proj:* attributes it returns rasterix center_transform()
            of the x/y coordinates, but create_raster_index passes it to
            RasterIndex.from_transform(), which expects the corner transform: the output is
            then shifted half a source pixel east and south. Wraps the module attribute (the
            converter calls utils.extract_spatial_info_stac); no-op for a transform that
            already is the corner one (fixed upstream) or comes from proj:transform.
            """
            if not FIX_HALF_PIXEL:
                print("half-pixel correction disabled (FIX_HALF_PIXEL = False)")
                return
            for name in ("healpix_convert.core.utils", "legacy_converters.core.utils"):
                try:
                    module = importlib.import_module(name)
                except ImportError:
                    continue
                original = getattr(module, "extract_spatial_info_stac", None)
                if original is None or getattr(original, "g4e_patched", False):
                    continue

                def extract(ds, *args, _original=original, _module=module, **kwargs):
                    info = _original(ds, *args, **kwargs)
                    transforms = (info or {}).get("transform")
                    if not transforms or len(transforms) != 1 or not ds.data_vars:
                        return info
                    attrs = next(iter(ds.data_vars.values())).attrs
                    get_crs = getattr(_module, "_get_stac_proj_crs", None)
                    if get_crs is not None:
                        has_proj = get_crs(attrs) is not None
                    else:
                        has_proj = any(str(key).startswith("proj:") for key in attrs)
                    if has_proj or "x" not in ds.variables or "y" not in ds.variables:
                        return info  # proj:transform: already the corner transform
                    import rasterix

                    index = rasterix.assign_index(ds, x_dim="x", y_dim="y", crs=False).xindexes["x"]
                    corner, center = index.transform(), index.center_transform()
                    current = transforms[0]
                    if same_transform(current, corner):
                        return info  # fixed upstream
                    if not same_transform(current, center):
                        print(f"WARNING: unexpected transform {tuple(current)[:6]} (corner "
                              f"{tuple(corner)[:6]}), half-pixel correction not applied", flush=True)
                        return info
                    _half_pixel["corrected"] += 1
                    if _half_pixel["corrected"] == 1:
                        print(f"half-pixel correction ({_module.__name__}.extract_spatial_info_stac, "
                              f"logged once): pixel-center origin ({current.c}, {current.f}) -> "
                              f"pixel-corner origin ({corner.c}, {corner.f}), pixel size "
                              f"{corner.a} x {corner.e}", flush=True)
                    return dict(info, transform=[corner])

                extract.g4e_patched = True
                module.extract_spatial_info_stac = extract


        def import_api():
            try:
                from healpix_convert import ConvertSettings
                from legacy_converters import get_settings
                utils = "healpix_convert.core.utils"
            except ImportError:
                from legacy_converters import ConvertSettings, get_settings
                utils = "legacy_converters.core.utils"
            return types.SimpleNamespace(
                ConvertSettings=ConvertSettings,
                get_settings=get_settings,
                utils=importlib.import_module(utils),
            )


        def resolve_settings(api, name):
            text = name.strip()
            if text.startswith("{"):
                settings = api.ConvertSettings.model_validate_json(text)
            else:
                settings = api.get_settings(text)
            if not isinstance(settings, api.ConvertSettings):
                settings = api.ConvertSettings.model_validate(settings.model_dump())
            return settings


        def put_attrs(group, attrs):
            if hasattr(group.attrs, "put"):
                group.attrs.put(attrs)
            else:
                for key in [k for k in group.attrs if k not in attrs]:
                    del group.attrs[key]
                group.attrs.update(attrs)


        def public_url(path):
            """Public URL of an input path; None for a local path or a private object."""
            text = str(path).strip()
            for prefix, url in PUBLIC_URLS.items():
                if text.startswith(prefix):
                    return url + text[len(prefix):]
            if text.startswith(("https://", "http://")):
                return text
            return None


        def clean_links(links):
            """Links without self/root/parent/collection, derived_from with public URLs only."""
            kept, seen, dropped = [], set(), 0
            for link in links or []:
                if not isinstance(link, dict) or link.get("rel") in DROPPED_LINK_RELS:
                    continue
                if link.get("rel") == "derived_from":
                    href = public_url(link.get("href", ""))
                    if href is None:
                        dropped += 1
                        continue
                    link = dict(link, href=href)
                key = (link.get("rel"), link.get("href"))
                if key not in seen:
                    seen.add(key)
                    kept.append(link)
            if dropped:
                print(f"dropped {dropped} derived_from link(s) to local or private paths")
            return kept


        def clean_lineage(value):
            """processing:lineage naming the public URLs of the inputs only."""
            if isinstance(value, list):
                return [clean_lineage(v) for v in value]
            if not isinstance(value, str):
                return value
            if not value.startswith(LINEAGE_PREFIX):
                for prefix, url in PUBLIC_URLS.items():
                    value = value.replace(prefix, url)
                return value
            paths = [p.strip() for p in value[len(LINEAGE_PREFIX):].split(", ") if p.strip()]
            urls = [url for url in map(public_url, paths) if url]
            others = len(paths) - len(urls)
            described = ", ".join(urls)
            if others:
                described += (f" and {others} other" if urls else f"{others}") + " input dataset(s)"
            return LINEAGE_PREFIX + described


        def stored_chunk_indices(fs, array_path, array):
            """Chunk indices along the last (cell) dimension of the chunks stored for an array
            (zarr does not store a chunk that holds only fill values)."""
            shards = getattr(array, "shards", None)
            per_key = shards[-1] // array.chunks[-1] if shards else 1
            prefix = array_path.rstrip("/") + "/"
            indices = set()
            for key in fs.find(array_path):
                rel = key[len(prefix):] if key.startswith(prefix) else ""
                if not rel or rel.rsplit("/", 1)[-1] in ZARR_METADATA_KEYS:
                    continue
                if rel[:2] in ("c/", "c."):
                    rel = rel[2:]
                parts = re.split(r"[./]", rel)
                if len(parts) != array.ndim or not all(part.isdigit() for part in parts):
                    continue
                start = int(parts[-1]) * per_key
                indices.update(range(start, start + per_key))
            return indices


        def group_data_cells(api, root, fs, root_path, geometry, output_group, group_settings):
            """(chunk level, ellipsoid, chunk-level cell ids with stored data, array name) of a
            dense group, None for the other chunk methods."""
            import numpy as np

            chunk = group_settings.chunk
            if chunk.method != "healpix_cell_dense":
                return None
            level = group_settings.healpix.refinement_level
            chunk_level = chunk.healpix.refinement_level
            ellipsoid = getattr(chunk.healpix.ellipsoid, "name", chunk.healpix.ellipsoid)
            coordinate = getattr(group_settings.healpix, "coordinate", "cell_ids")
            group = root[output_group]
            cell_ids = group[coordinate]
            size = cell_ids.chunks[-1]
            if size != 4 ** (level - chunk_level):
                raise ValueError(f"{output_group}: {size} cells per chunk, not 4**({level}-{chunk_level})")
            # the chunk cells, in chunk order, as the converter computed them
            chunk_ids, _ = api.utils.compute_output_chunk_info(geometry, chunk_level, ellipsoid)
            chunk_ids = np.asarray(chunk_ids, dtype="uint64")
            if chunk_ids.size * size != cell_ids.shape[-1]:
                raise ValueError(f"{output_group}: {chunk_ids.size} chunk cells for {cell_ids.shape[-1]} cells")
            arrays = sorted(
                (name, array)
                for name, array in group.arrays()
                if name != coordinate and array.ndim >= 1
                and array.shape[-1] == cell_ids.shape[-1] and array.chunks[-1] == size
            )
            if not arrays:
                raise ValueError(f"{output_group}: no data array along the cell dimension")
            name, array = arrays[0]
            stored = sorted(i for i in stored_chunk_indices(fs, f"{root_path}/{output_group}/{name}", array)
                            if i < chunk_ids.size)
            shift = 2 * (level - chunk_level)
            for index in sorted({stored[0], stored[-1]} if stored else ()):
                first = int(cell_ids[index * size])
                if first >> shift != int(chunk_ids[index]):
                    raise ValueError(f"{output_group}: chunk {index} holds cell {first}, "
                                     f"not a child of chunk cell {int(chunk_ids[index])}")
            return chunk_level, str(ellipsoid).upper(), chunk_ids[stored], name


        def cells_union(cells):
            """Union (lon/lat polygon) of HEALPix cells given as {(level, ellipsoid): ids}."""
            import healpix_geo
            import numpy as np
            import shapely

            polygons = []
            for (level, ellipsoid), ids in sorted(cells.items()):
                ids = np.unique(np.asarray(sorted(ids), dtype="uint64"))
                lon, lat = healpix_geo.nested.vertices(ids, level, ellipsoid=ellipsoid)
                lon = (np.asarray(lon) + 180.0) % 360.0 - 180.0
                if np.any(lon.max(axis=1) - lon.min(axis=1) > 180.0):
                    raise ValueError("cells crossing the antimeridian are not supported")
                polygons.extend(shapely.polygons(np.stack([lon, np.asarray(lat)], axis=-1)))
            if not polygons:
                raise ValueError("no stored data chunk")
            # exact union first (neighbouring cells share bit-identical vertices), then
            # snap: union_all(grid_size=...) snap-rounds while it merges and leaves dozens
            # of 1e-7 deg wide triangular holes along cell edges (52 for orbit 4025)
            union = shapely.set_precision(shapely.union_all(polygons), GEOMETRY_GRID_SIZE)
            if union.is_empty or union.geom_type not in ("Polygon", "MultiPolygon"):
                raise ValueError(f"union of the cells is a {union.geom_type}")
            # a hole smaller than 1 % of the smallest cell is a numerical sliver, not a
            # missing chunk
            min_hole = 0.01 * float(shapely.area(polygons).min())
            parts = [shapely.Polygon(p.exterior, [r for r in p.interiors
                                                  if shapely.Polygon(r).area >= min_hole])
                     for p in getattr(union, "geoms", [union])]
            union = parts[0] if union.geom_type == "Polygon" else shapely.MultiPolygon(parts)
            if hasattr(shapely, "orient_polygons"):
                union = shapely.orient_polygons(union)  # exterior counter-clockwise (RFC 7946)
            return union


        def data_geometry(api, root, settings, cache, output_options):
            """Union of the chunk-level HEALPix cells holding stored data chunks (one
            representative data array per dense group)."""
            import fsspec.core
            import shapely.geometry

            fs, root_path = fsspec.core.url_to_fs(output_path, **(output_options or {}))
            root_path = root_path.rstrip("/")
            geometry = shapely.geometry.shape(cache["output_spatial"]["geometry_latlon"])
            io_path_map = cache["output_groups"]["io_path_map"]
            cells = {}
            for input_group in sorted(cache["input_spatial_groups"]):
                output_group = io_path_map[input_group]
                found = group_data_cells(api, root, fs, root_path, geometry, output_group,
                                         settings.group_settings[PurePath(input_group)])
                if found is None:
                    continue
                chunk_level, ellipsoid, ids, name = found
                cells.setdefault((chunk_level, ellipsoid), set()).update(int(i) for i in ids)
                print(f"  - {output_group}: {len(ids)} chunk(s) with data ({name}), level {chunk_level}")
            union = cells_union(cells)
            n_cells = sum(len(ids) for ids in cells.values())
            print(f"geometry: union of {n_cells} chunk-level HEALPix cell(s) with data, "
                  f"{union.geom_type} of {len(shapely.get_coordinates(union))} vertices")
            return union


        def output_geometry(api, root, settings, cache, output_options):
            """(geometry, source): the cells with data, else output_extent, else None (keep)."""
            import shapely.geometry

            try:
                return data_geometry(api, root, settings, cache, output_options), "data chunks"
            except Exception as exc:
                print(f"WARNING: no geometry from the stored chunks ({type(exc).__name__}: {exc})")
            if output_extent.strip():
                try:
                    return shapely.geometry.shape(json.loads(output_extent)), "output_extent"
                except Exception as exc:
                    print(f"WARNING: invalid output_extent ({type(exc).__name__}: {exc})")
            return None, "prepare (unchanged)"


        def clean_stac_item(item, geometry):
            """(the root STAC item as stac-scraper should index it, see the header
            comment; the processing:expression removed from it, None if absent)."""
            import shapely
            import shapely.geometry

            item = dict(item)
            properties = {k: v for k, v in (item.get("properties") or {}).items() if not k.startswith("proj:")}
            # the settings object of healpix-convert: the other items of the catalogue
            # have the string "systematic" (rustac's geoparquet writer fails on mixed
            # types) and the processing v1.2.0 schema requires an object; an absent
            # field fits both
            expression = properties.pop("processing:expression", None)
            if "processing:lineage" in properties:
                properties["processing:lineage"] = clean_lineage(properties["processing:lineage"])
            item["properties"] = properties
            # no proj:* left anywhere (assets are dropped)
            item["stac_extensions"] = [u for u in item.get("stac_extensions") or [] if "/projection/" not in u]
            item["assets"] = {}
            item["links"] = clean_links(item.get("links"))
            if geometry is not None:
                item["geometry"] = json.loads(shapely.to_geojson(geometry))
            try:
                west, south, east, north = shapely.geometry.shape(item["geometry"]).bounds
                item["bbox"] = [west, south, east, north]
            except Exception as exc:
                print(f"WARNING: bbox not recomputed ({type(exc).__name__}: {exc})")
            return item, expression


        def parse_extent_info(text):
            """extent_info (validated by stage-cache) as a dict; {} if unusable."""
            try:
                value = json.loads(text.strip() or "{}")
            except ValueError:
                value = None
            if not isinstance(value, dict):
                print(f"WARNING: extent_info is not a JSON object, not stored: {text[:80]!r}")
                return {}
            return value


        def main():
            s3_options = configure_s3(s3_endpoint)
            output_options = storage_options_for(output_path, s3_options)

            import xarray as xr
            import zarr

            api = import_api()
            fix_half_pixel()
            settings = resolve_settings(api, settings_name)
            # plain JSON: the group layout is all that is needed here, re-opening the
            # inputs with ConvertStagingCache.from_json would only cost time
            with open(CACHE_FILE) as f:
                cache = json.load(f)
            spatial_groups = set(cache["input_spatial_groups"])
            io_path_map = cache["output_groups"]["io_path_map"]

            root = zarr.open_group(output_path, mode="r+", storage_options=output_options)

            # every chunk task of a dense group writes the cell ids of its chunks, so a
            # missing cell id chunk means a chunk that was never converted. (A task that
            # failed after writing the cell ids of a chunk is not detected here, but a
            # failed task fails the run before finalize.)
            problems = []
            for input_group in sorted(spatial_groups):
                output_group = io_path_map[input_group]
                group_settings = settings.group_settings[PurePath(input_group)]
                coordinate = getattr(group_settings.healpix, "coordinate", "cell_ids")
                method = group_settings.chunk.method
                if not isinstance(coordinate, str) or f"{output_group}/{coordinate}" not in root:
                    problems.append(f"{output_group}: no {coordinate} array")
                    continue
                cell_ids = root[f"{output_group}/{coordinate}"]
                written, expected = cell_ids.nchunks_initialized, cell_ids.nchunks
                print(f"  - {output_group} ({method}): {written}/{expected} cell id chunk(s) written")
                if method == "healpix_cell_dense" and written != expected:
                    problems.append(f"{output_group}: {expected - written} chunk(s) missing")
                elif written == 0:
                    # e.g. no_chunk groups with legacy_converters de458eb, which skips them
                    print(f"WARNING: {output_group} has no data (not converted by this converter version?)")
            if problems:
                fail("incomplete output (re-run the failed tasks with an Argo retry of the workflow, "
                     "e.g. retry_workflow of the Python client, see tf/README.md):\n  "
                     + "\n  ".join(problems), EXIT_INCOMPLETE)

            # every array and group is written: consolidate, then clean the STAC item
            # held back by prepare and publish it (stac-scraper indexes the dataset from
            # then on), then consolidate again for the new root attributes
            zarr.consolidate_metadata(root.store)
            root = zarr.open_group(output_path, mode="r+", storage_options=output_options)
            attrs = dict(root.attrs)
            item = attrs.pop(PENDING_STAC_KEY, None)
            if item is None:
                # a retry after the publication: clean it again (idempotent)
                item = attrs.get("stac_discovery")
            if not isinstance(item, dict):
                fail("the root group has neither stac_discovery nor " + PENDING_STAC_KEY, EXIT_INCOMPLETE)
            geometry, source = output_geometry(api, root, settings, cache, output_options)
            item, expression = clean_stac_item(item, geometry)
            print(f"STAC item cleaned: geometry from {source}, bbox {item.get('bbox')}, "
                  f"{len(item['links'])} link(s), no assets")
            attrs["stac_discovery"] = item
            if expression is not None:
                # (a retry after the publication finds it there already)
                attrs[SETTINGS_KEY] = expression
                print(f"processing:expression moved to the root attribute {SETTINGS_KEY}")
            orbit_extent = parse_extent_info(extent_info)
            if orbit_extent:
                attrs[ORBIT_EXTENT_KEY] = orbit_extent
            # one write: the item is published and the pending marker removed together
            put_attrs(root, attrs)
            print("published the root stac_discovery")
            zarr.consolidate_metadata(root.store)
            print(f"consolidated metadata of {output_path}")

            tree = xr.open_datatree(
                output_path,
                engine="zarr",
                storage_options=output_options,
                chunks={},
                create_default_indexes=False,
            )
            print("output groups:")
            for path in tree.groups:
                node = tree[path]
                if node.data_vars:
                    size = sum(v.nbytes for v in node.data_vars.values()) / 1e9
                    print(f"  - {path}: {dict(node.sizes)} {sorted(node.data_vars)} ({size:.2f} GB)")
            stac = tree.attrs.get("stac_discovery")
            if not isinstance(stac, dict) or not stac.get("id"):
                fail("the root group has no stac_discovery item (with an id)", EXIT_INCOMPLETE)
            if PENDING_STAC_KEY in tree.attrs:
                fail(f"{PENDING_STAC_KEY} is still in the root attributes")
            props = stac.get("properties", {})
            print(f"stac_discovery id: {stac['id']}")
            print(f"bbox: {stac.get('bbox')}, datetime: {props.get('datetime')} "
                  f"({props.get('start_datetime')} / {props.get('end_datetime')})")
            if ORBIT_EXTENT_KEY in tree.attrs:
                print(f"{ORBIT_EXTENT_KEY}: {json.dumps(tree.attrs[ORBIT_EXTENT_KEY])[:300]}")

            os.makedirs(OUT_DIR, exist_ok=True)
            with open(os.path.join(OUT_DIR, "output_path"), "w") as f:
                f.write(output_path)
            with open(os.path.join(OUT_DIR, "stac_item_id"), "w") as f:
                f.write(stac["id"])


        if __name__ == "__main__":
            main()
