        output_extent = r'''{{inputs.parameters.output_extent}}'''
        extent_info = r'''{{inputs.parameters.extent_info}}'''
        s3_endpoint = "{{inputs.parameters.s3_endpoint}}"

        import importlib
        import json
        import os
        import re
        import sys
        import types
        from pathlib import PurePath

        S3_CREDS_DIR = "/etc/s3"
        CACHE_FILE = "/tmp/in/cache.json"
        OUT_DIR = "/tmp/out"
        PUBLIC_READ_PREFIXES = ("s3://grid4earth/public/",)
        # slow or flaky links: long timeouts and adaptive retries for every S3 client
        S3_CONFIG_KWARGS = {
            "connect_timeout": 120,
            "read_timeout": 600,
            "retries": {"max_attempts": 10, "mode": "adaptive"},
        }
        FIX_HALF_PIXEL = True  # see fix_half_pixel()
        PENDING_STAC_KEY = "stac_discovery_pending"  # written by prepare
        ORBIT_EXTENT_KEY = "orbit_extent"  # root attribute holding extent_info
        # root attribute holding the conversion settings, i.e. the processing:expression
        # object of healpix-convert, which is removed from the STAC item
        SETTINGS_KEY = "healpix_convert_settings"
        EXIT_INCOMPLETE = 2  # not retried by the retryStrategy
        # public URLs of the objects under these prefixes (STAC links and lineage)
        PUBLIC_URLS = {"s3://grid4earth/public/": "https://data.grid4earth.eu/"}
        # links copied from the first input item that do not describe the output
        DROPPED_LINK_RELS = ("self", "root", "parent", "collection")
        LINEAGE_PREFIX = "Resampled onto HEALPix by healpix-convert from "
        # degrees (~1 cm): the union of the cells is snapped to this grid AFTER an exact
        # union (snap-rounding during the union leaves thin false holes along cell edges)
        GEOMETRY_GRID_SIZE = 1e-7
        ZARR_METADATA_KEYS = ("zarr.json", ".zarray", ".zattrs", ".zgroup", ".zmetadata")


        def fail(message, code=1):
            print(f"ERROR: {message}", flush=True)
            sys.exit(code)


        def read_s3_credentials():
            """(key, secret) from the mounted secret, or None when it is not mounted."""
            key_file = os.path.join(S3_CREDS_DIR, "accessKey")
            secret_file = os.path.join(S3_CREDS_DIR, "secretKey")
            if not (os.path.isfile(key_file) and os.path.isfile(secret_file)):
                return None
            with open(key_file) as f:
                key = f.read().strip()
            with open(secret_file) as f:
                secret = f.read().strip()
            return key, secret


        def configure_s3(endpoint):
            """Let s3:// paths opened without storage options use the cluster credentials.

            Returns the storage options for explicit S3 access, or None without credentials.
            """
            creds = read_s3_credentials()
            if creds is None:
                print(f"no S3 credentials in {S3_CREDS_DIR}: s3:// paths are not accessible")
                return None
