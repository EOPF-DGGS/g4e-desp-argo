      source: |
        # Argo parameters (substituted by Argo before the script runs)
        output_path = "{{inputs.parameters.output_path}}"
        settings_name = r'''{{inputs.parameters.settings_name}}'''
        s3_endpoint = "{{inputs.parameters.s3_endpoint}}"

        import json
        import os
        import sys
        import types
        from pathlib import PurePath

        S3_CREDS_DIR = "/etc/s3"
        CACHE_FILE = "/tmp/in/cache.json"
        OUT_DIR = "/tmp/out"
        PUBLIC_READ_PREFIXES = ("s3://grid4earth/public/",)
        PENDING_STAC_KEY = "stac_discovery_pending"  # written by prepare
        EXIT_INCOMPLETE = 2  # not retried by the retryStrategy


        def fail(message, code=1):
            print(f"ERROR: {message}", flush=True)
            sys.exit(code)


        def read_s3_credentials():
            """(key, secret) from the mounted secret, or None when it is not mounted."""
            key_file = os.path.join(S3_CREDS_DIR, "accessKey")
            secret_file = os.path.join(S3_CREDS_DIR, "secretKey")
            if not (os.path.isfile(key_file) and os.path.isfile(secret_file)):
                return None
            with open(key_file) as f:
                key = f.read().strip()
            with open(secret_file) as f:
                secret = f.read().strip()
            return key, secret


        def configure_s3(endpoint):
            """Let s3:// paths opened without storage options use the cluster credentials.

            Returns the storage options for explicit S3 access, or None without credentials.
            """
            creds = read_s3_credentials()
            if creds is None:
                print(f"no S3 credentials in {S3_CREDS_DIR}: s3:// paths are not accessible")
                return None
            key, secret = creds
            os.environ["AWS_ACCESS_KEY_ID"] = key
            os.environ["AWS_SECRET_ACCESS_KEY"] = secret
            if endpoint:
                os.environ["AWS_ENDPOINT_URL"] = endpoint
            import fsspec.config

            options = {"key": key, "secret": secret}
            if endpoint:
                options["client_kwargs"] = {"endpoint_url": endpoint}
            fsspec.config.conf["s3"] = json.loads(json.dumps(options))
            return options


        def storage_options_for(url, s3_options):
            if not url.startswith("s3://"):
                return None
            if s3_options is None:
                fail(f"{url} needs S3 credentials in {S3_CREDS_DIR}")
            options = json.loads(json.dumps(s3_options))
            if url.startswith(PUBLIC_READ_PREFIXES):
                options["s3_additional_kwargs"] = {"ACL": "public-read"}
            return options


        def import_api():
            try:
                from healpix_convert import ConvertSettings
                from legacy_converters import get_settings
            except ImportError:
                from legacy_converters import ConvertSettings, get_settings
            return types.SimpleNamespace(ConvertSettings=ConvertSettings, get_settings=get_settings)


        def resolve_settings(api, name):
            text = name.strip()
            if text.startswith("{"):
                settings = api.ConvertSettings.model_validate_json(text)
            else:
                settings = api.get_settings(text)
            if not isinstance(settings, api.ConvertSettings):
                settings = api.ConvertSettings.model_validate(settings.model_dump())
            return settings


        def put_attrs(group, attrs):
            if hasattr(group.attrs, "put"):
                group.attrs.put(attrs)
            else:
                for key in [k for k in group.attrs if k not in attrs]:
                    del group.attrs[key]
                group.attrs.update(attrs)


        def main():
            s3_options = configure_s3(s3_endpoint)
            output_options = storage_options_for(output_path, s3_options)

            import xarray as xr
            import zarr

            settings = resolve_settings(import_api(), settings_name)
            # plain JSON: the group layout is all that is needed here, re-opening the
            # inputs with ConvertStagingCache.from_json would only cost time
            with open(CACHE_FILE) as f:
                cache = json.load(f)
            spatial_groups = set(cache["input_spatial_groups"])
            io_path_map = cache["output_groups"]["io_path_map"]

            root = zarr.open_group(output_path, mode="r+", storage_options=output_options)

            # every chunk task of a dense group writes the cell ids of its chunks, so a
            # missing cell id chunk means a chunk that was never converted. (A task that
            # failed after writing the cell ids of a chunk is not detected here, but a
            # failed task fails the run before finalize.)
            problems = []
            for input_group in sorted(spatial_groups):
                output_group = io_path_map[input_group]
                group_settings = settings.group_settings[PurePath(input_group)]
                coordinate = getattr(group_settings.healpix, "coordinate", "cell_ids")
                method = group_settings.chunk.method
                if not isinstance(coordinate, str) or f"{output_group}/{coordinate}" not in root:
                    problems.append(f"{output_group}: no {coordinate} array")
                    continue
                cell_ids = root[f"{output_group}/{coordinate}"]
                written, expected = cell_ids.nchunks_initialized, cell_ids.nchunks
                print(f"  - {output_group} ({method}): {written}/{expected} cell id chunk(s) written")
                if method == "healpix_cell_dense" and written != expected:
                    problems.append(f"{output_group}: {expected - written} chunk(s) missing")
                elif written == 0:
                    # e.g. no_chunk groups with legacy_converters de458eb, which skips them
                    print(f"WARNING: {output_group} has no data (not converted by this converter version?)")
            if problems:
                fail("incomplete output (re-run the failed tasks with `argo retry`):\n  "
                     + "\n  ".join(problems), EXIT_INCOMPLETE)

            # publish the STAC item held back by prepare: stac-scraper indexes the
            # dataset from now on
            attrs = dict(root.attrs)
            if PENDING_STAC_KEY in attrs:
                attrs["stac_discovery"] = attrs.pop(PENDING_STAC_KEY)
                put_attrs(root, attrs)
                print("published the root stac_discovery")
            elif "stac_discovery" not in attrs:
                fail("the root group has neither stac_discovery nor " + PENDING_STAC_KEY, EXIT_INCOMPLETE)
            zarr.consolidate_metadata(root.store)
            print(f"consolidated metadata of {output_path}")

            tree = xr.open_datatree(
                output_path,
                engine="zarr",
                storage_options=output_options,
                chunks={},
                create_default_indexes=False,
            )
            print("output groups:")
            for path in tree.groups:
                node = tree[path]
                if node.data_vars:
                    size = sum(v.nbytes for v in node.data_vars.values()) / 1e9
                    print(f"  - {path}: {dict(node.sizes)} {sorted(node.data_vars)} ({size:.2f} GB)")
            stac = tree.attrs.get("stac_discovery")
            if not isinstance(stac, dict) or not stac.get("id"):
                fail("the root group has no stac_discovery item (with an id)", EXIT_INCOMPLETE)
            props = stac.get("properties", {})
            print(f"stac_discovery id: {stac['id']}")
            print(f"bbox: {stac.get('bbox')}, datetime: {props.get('datetime')} "
                  f"({props.get('start_datetime')} / {props.get('end_datetime')})")

            os.makedirs(OUT_DIR, exist_ok=True)
            with open(os.path.join(OUT_DIR, "output_path"), "w") as f:
                f.write(output_path)
            with open(os.path.join(OUT_DIR, "stac_item_id"), "w") as f:
                f.write(stac["id"])


        if __name__ == "__main__":
            main()
