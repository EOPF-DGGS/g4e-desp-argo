crds:
  install: true
createAggregateRoles: true
singleNamespace: true
controller:
  clusterWorkflowTemplates:
    enabled: false
  workflowNamespaces:
    - argo
server:
  authModes:
    - server
  clusterWorkflowTemplates:
    enabled: false
  serviceType: ClusterIP
  # The argo.grid4earth.eu ingress was removed from the cluster on 2026-10-09:
  # the server is reached in-cluster only (argo-workflows-server.argo.svc:2746,
  # e.g. from JupyterHub). Keep it disabled so that an apply does not recreate it.
  ingress:
    enabled: false
workflow:
  serviceAccount:
    create: true
    name: "argo-workflow"
executor:
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
artifactRepositoryRef:
  artifact-repositories:
    annotations:
      workflows.argoproj.io/default-artifact-repository: default-v1-s3
    # Every key other than "annotations" becomes a ConfigMap data key (chart
    # template artifact-repository-ref-cm.yaml), so the repository is given as
    # a map directly under the ConfigMap name, not under "data:".
    default-v1-s3:
      archiveLogs: true
      s3:
        bucket: g4e-desp-argo-artifacts
        endpoint: s3.gra.io.cloud.ovh.net
        insecure: false
        region: gra
        accessKeySecret:
          name: argo-s3-credentials
          key: accessKey
        secretKeySecret:
          name: argo-s3-credentials
          key: secretKey
