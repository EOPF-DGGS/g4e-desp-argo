# Build containers/Dockerfile_private_orbit and push it to the OVH Harbor
# registry (project healpix-private), without a maintainer machine.
#
# Run it from the Actions tab: "Build orbit image" -> Run workflow.
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   HARBOR_USERNAME  Harbor robot account with pull + push on healpix-private
#   HARBOR_PASSWORD  its secret
#   G4E_READ_TOKEN   fine-grained PAT, Contents: read-only on
#                    GRID4EARTH/legacy-converters and GRID4EARTH/stac-scraper
#                    (passed to the build as the BuildKit secret github_token)
name: Build orbit image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA of this repository that has containers/Dockerfile_private_orbit (use orbit-pipeline until it is merged)"
        required: true
        default: main
      tag:
        description: "Image tag pushed as healpix-private/g4e-jupyterhub-private:<tag>"
        required: true
        default: 2026-10-10-orbit
      healpix_convert_sha:
        description: "Optional: full healpix-convert commit SHA (empty = Dockerfile default)"
        required: false
        default: ""
      legacy_converters_sha:
        description: "Optional: full legacy-converters commit SHA (empty = Dockerfile default)"
        required: false
        default: ""
      stac_scraper_sha:
        description: "Optional: full stac-scraper commit SHA (empty = Dockerfile default)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-orbit-image-${{ inputs.tag }}
  cancel-in-progress: false

env:
  REGISTRY: y74y55mn.gra7.container-registry.ovh.net
  IMAGE: y74y55mn.gra7.container-registry.ovh.net/healpix-private/g4e-jupyterhub-private

jobs:
  build-and-push:
    if: github.repository == 'GRID4EARTH/g4e-desp-argo'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space (the base image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af > /dev/null
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Inputs reach the shell only through environment variables and are
      # validated before use (no ${{ }} expansion inside the script).
      - name: Validate inputs and prepare build arguments
        id: args
        env:
          TAG: ${{ inputs.tag }}
          HEALPIX_CONVERT_SHA: ${{ inputs.healpix_convert_sha }}
          LEGACY_CONVERTERS_SHA: ${{ inputs.legacy_converters_sha }}
          STAC_SCRAPER_SHA: ${{ inputs.stac_scraper_sha }}
        run: |
          set -eu
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "::error::invalid image tag: $TAG"; exit 1
          fi
          test -f containers/Dockerfile_private_orbit || {
            echo "::error::containers/Dockerfile_private_orbit not found at this ref"; exit 1; }
          {
            echo "build_args<<EOF_ARGS"
            for name in HEALPIX_CONVERT_SHA LEGACY_CONVERTERS_SHA STAC_SCRAPER_SHA; do
              value="${!name}"
              [ -z "$value" ] && continue
              if ! printf '%s' "$value" | grep -Eq '^[0-9a-f]{40}$'; then
                echo "::error::$name must be a full 40-character commit SHA" >&2; exit 1
              fi
              echo "$name=$value"
            done
            echo "EOF_ARGS"
          } >> "$GITHUB_OUTPUT"
          echo "image: $IMAGE:$TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: containers/
          # `file` is relative to the workspace, not to the context
          file: containers/Dockerfile_private_orbit
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}
          build-args: ${{ steps.args.outputs.build_args }}
          secrets: |
            github_token=${{ secrets.G4E_READ_TOKEN }}

      - name: Summary
        env:
          TAG: ${{ inputs.tag }}
          REF: ${{ inputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Pushed \`$IMAGE:$TAG\`"
            echo ""
            echo "- source ref: \`$REF\` ($(git rev-parse --short HEAD))"
            echo "- digest: \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
